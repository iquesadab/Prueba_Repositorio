<!DOCTYPE html>
<html lang="en">
<!-- Comentario -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/calculadora.css">
    <link rel="stylesheet" href="css/modal-swalert.css">
</head>

<body>

    <h1>Cálculo del IMC</h1>
    <!-- Formulario -->
    <form>
            <!-- Div y agrupo la etiqueta y la informacion porque van juntos-->
        <div class="contenedor-input-etiqueta">
            <label for="txtPeso">Peso: </label> <!-- Esta es la etiqueta antes de la cajita BUSCAR AREA LABEL (PARA QUIENES NO VEN)-->
            <input type="number" id="txtPeso"> <!-- "number" : Le puedo agregar el dato que el usuario vaya a ingresar -->
        </div>

        <div>
            <label for="txtEstatura">Estatura: </label>
            <input type="number" id="txtEstatura">
        </div>

        <button type="button" id="btnCalcularIMC">Calcular IMC</button> <!--ID que uso en js para saber que ingresan al boton-->
    
    </form>

        <section id="sctResultadoIMC">
            <h2>IMC:</h2>
            <p></p>
        </section>
    

    <!-- Antes de cerrar el body se enlazan los archivos de JS -->

    <script src = "https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- https://sweetalert2.github.io/#download --> <!-- Link de la pagina externa que me permite agregar alertas-->


    <script src="js/imc.js"></script> <!-- Asi enlazo un JS -->
</body>

</html>
