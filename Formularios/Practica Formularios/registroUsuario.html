<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistroUsuario</title>

    <!--FontAwesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/estilos.css">

</head>
<body>

    <form class = "contenedor"> 
        <div class = "tarjeta">
            <h1 class="h1">Registro de usuario</h1>

            <!--Usuario-->
            <div class="campo">
                <div class="icono">
                    <i class="fa-solid fa-user"></i>
                </div>
                <input type="text" id="txtUsuario" placeholder="nombre de usuario">
            </div>

            <!--Contraseña-->
            <div class="campo">
                <div class="icono">
                    <i class="fa-solid fa-key"></i>
                </div>
                <input type="password" id="txtContrasena" placeholder="contraseña">
            </div>

            <!--Confirmar Contraseña-->
            <div class="campo">
                <div class="icono">
                    <i class="fa-solid fa-key"></i>
                </div>
                <input type="password" id="txtConfirmar" placeholder="confirmar contraseña">
            </div>

            <button type="button" id="crearCuenta">Crear Cuenta</button>

        </div>

    </form>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/registro.js"></script>
</body>
</html>
